name: Run Crawling

on:
  schedule:
    - cron: "37 6 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      scrape_target_date:
        description: "Optional target date in YYYY-MM-DD"
        required: false
        type: string

jobs:
  api-request-job:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies and update SSL certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          python -m pip install --upgrade pip
          pip install requests
          pip install gspread
          pip install oauth2client
          pip install pytz

      - name: Set up Google Sheets API credentials
        env:
          JSON_BASE64: ${{ secrets.JSON_BASE64 }}
        run: |
          printf '%s' "$JSON_BASE64" | base64 --decode > ./cowithone-scrap-1686123588417-7ea5acec3d36.json
          chmod 600 ./cowithone-scrap-1686123588417-7ea5acec3d36.json

      - name: Verify Google Sheets API credentials file
        run: |
          test -s ./cowithone-scrap-1686123588417-7ea5acec3d36.json
          echo "Google Sheets API credentials file created."

      - name: Set environment variables
        run: |
          echo "JSON_KEYFILE=${{ secrets.JSON_KEYFILE }}" >> $GITHUB_ENV
          echo "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> $GITHUB_ENV
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
          echo "API_KEY2=${{ secrets.API_KEY2 }}" >> $GITHUB_ENV
          echo "SLACK_WEBHOOK_NARA_URL=${{ secrets.SLACK_WEBHOOK_NARA_URL }}" >> $GITHUB_ENV
          echo "SLACK_WEBHOOK_NAVER_URL=${{ secrets.SLACK_WEBHOOK_NAVER_URL }}" >> $GITHUB_ENV
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> $GITHUB_ENV
          echo "CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> $GITHUB_ENV

      - name: Run main.py
        env:
          SCRAPE_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.scrape_target_date || '' }}
        run: python main.py # API 요청을 할 Python 스크립트 실행
